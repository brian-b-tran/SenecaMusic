<mat-card style="margin-bottom: 1rem;">
    <mat-card-title-group>
        <mat-card-title>{{artist.name}}</mat-card-title>
        <mat-card-subtitle>
            Full discography for {{artist.name}}
            Click the <strong>album cover</strong> for more information.
        </mat-card-subtitle>
</mat-card-title-group>

</mat-card>
<mat-card
    [ngStyle]="{'background': 'url(' + artist.images[0].url + ') no-repeat center center / cover'}"
  [style.height]="'450px'">
</mat-card>
<br /><br />
<h1>Full Discography</h1>

<div fxLayout="row wrap" fxLayout.xs="column">

    <!-- Single "Responsive" Card-->
    <div fxFlex [style.margin]="'20px'" *ngFor="let info of albums">
        <mat-card [style.min-width]="'200px'">
            <mat-card-header>
                <mat-card-title>{{info.name}}</mat-card-title>
                <mat-card-subtitle>Album Title</mat-card-subtitle>
            </mat-card-header>

            <a [routerLink]="['/album', info.id]"><img mat-card-image class="album-cover" 
                src="{{info.images[0].url}}" alt="album art"></a>
            <strong>Release Date: </strong>{{info.release_date | date:'M/d/yy'}}<br />
            <strong>Tracks: </strong>{{info.total_tracks}}
        </mat-card>
    </div>
    <!-- -->

</div>
