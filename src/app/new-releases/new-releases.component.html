<mat-card>
    <mat-card-title>New Releases</mat-card-title>
    <mat-card-subtitle>
        The following is a list of new releases.
        Click the <strong>album cover</strong>  or <strong>artist name</strong> for more information.</mat-card-subtitle>
</mat-card>

<div class="content">
    <div fxLayout="row wrap" fxLayout.xs="column">

        <!-- Single "Responsive" Card-->
        <div fxFlex [style.margin]="'20px'" *ngFor="let info of releases">
            <mat-card [style.min-width]="'200px'">
                <mat-card-header>
                    <mat-card-title>{{info.name}}</mat-card-title>
                    <mat-card-subtitle>New Release</mat-card-subtitle>
                </mat-card-header>
                <img [routerLink]="['/album', info.id]" mat-card-image  class="album-cover" src={{info.images[0].url}} alt="album art" >
                <strong>Release Date: </strong>{{info.release_date}}<br />
                <strong>Tracks: </strong>{{info.total_tracks}}<br /><br />
                <mat-card-content> 
                    <mat-chip-list aria-label="Artist selection" >
                        <mat-chip *ngFor="let artists of info.artists" [routerLink]="['/artist', artists.id]" >{{artists.name}}</mat-chip>
                    </mat-chip-list>
                </mat-card-content>
            </mat-card>
        </div>
        <!-- -->

    </div>
</div>
